default: &default
  dispatchers:
    - polling_interval: 1
      batch_size: 500
  workers:
    # One thread, one process: Ohdio API calls run strictly one at a time (OhdioApiJob relies on
    # this for global rate limiting), and can't starve the other queues.
    - queues: "ohdio_api"
      threads: 1
      processes: 1
      polling_interval: 0.1
    - queues: [ "default", "solid_queue_recurring" ]
      threads: 3
      processes: <%= ENV.fetch("JOB_CONCURRENCY", 1) %>
      polling_interval: 0.1

development:
  <<: *default

test:
  <<: *default

production:
  <<: *default
